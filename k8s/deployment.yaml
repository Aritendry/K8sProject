# Serveur web : Nginx officiel + le site monté via un ConfigMap (généré par
# Kustomize depuis k8s/site/). Aucune image applicative à construire (pas de Docker).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: ecommerce
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ecommerce
  template:
    metadata:
      labels:
        app: ecommerce
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: site
              mountPath: /usr/share/nginx/html
              readOnly: true
          readinessProbe:
            httpGet:
              path: /index.html
              port: 80
      volumes:
        - name: site
          configMap:
            name: ecommerce-site
