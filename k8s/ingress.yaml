# Expose le site via l'Ingress Controller de k3s (Traefik par défaut) sur
# https://www.ecommerce.lcl (domaine déclaré dans /etc/hosts).
# Passe tout le HTTP vers HTTPS.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
  namespace: ecommerce
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - www.ecommerce.lcl
      secretName: ecommerce-tls
  rules:
    - host: www.ecommerce.lcl
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 80
