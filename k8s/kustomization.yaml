# Point d'entrée ArgoCD : path = ./k8s
# Le ConfigMap du site est déclaré manuellement (configmap.yaml) pour que son
# nom soit exactement "ecommerce-site" (référence du Deployment) — les versions
# de kustomize ne réécrivent pas toujours les références des générateurs.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - tls.yaml
