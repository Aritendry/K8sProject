# Secret TLS avec un certificat auto-signé pour www.ecommerce.lcl (généré via
# openssl, pas de Docker). L'Ingress l'utilise pour servir le site en HTTPS.
# NB : ne jamais versionner de clé privée en production ; ici c'est une démo.
apiVersion: v1
kind: Secret
metadata:
  name: ecommerce-tls
  namespace: ecommerce
type: kubernetes.io/tls
data:
  tls.crt: ""
  tls.key: ""
